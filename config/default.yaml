# studykb defaults. Override per-key with env vars (STUDYKB__SECTION__KEY) or
# with config/local.yaml, which is gitignored. Never edit code to change any of
# the values below.

# OpenAI-compatible endpoint. ollama, LM Studio, vLLM and the hosted APIs all
# speak this, so one client covers every backend; swapping is a URL change.
llm_endpoint: "http://host.docker.internal:11434/v1"
llm_api_key: "ollama"          # ollama ignores it, the OpenAI client requires it

models:
  embed:
    name: "bge-m3"
    dim: 1024
    batch: 32
  vlm:
    name: "qwen2.5vl:7b"
    fallback: "granite3.2-vision:2b"
    # Qwen2.5-VL uses dynamic resolution: uncapped, a full-res slide blows up the
    # visual token count and saturates 8 GB of VRAM. 1280 px on the long side is
    # the working ceiling on a 3070 Ti.
    max_long_side_px: 1280
  llm:
    name: "qwen3:8b"
    num_ctx: 16384
    temperature: 0.2

storage:
  qdrant_url: "http://qdrant:6333"
  collection: "studykb"
  state_db: "/data/state.db"     # sqlite, drives incremental ingestion
  vault: "/vault"                # bind-mounted Obsidian vault

extract:
  ocr:
    # Off: the only source that triggers it is a handwritten lecture, and
    # tesseract reads printed type, not handwriting. Worse, OCR output is
    # extracted as provenance: text-layer — the most trusted label — so a run
    # would index its guesses as if they had been read from the file. Turn it
    # back on the day a scan of *printed* text arrives.
    enabled: false
    # A page under this many characters is treated as having no text layer.
    trigger_chars_per_page: 120
    cmd: ["ocrmypdf", "--language", "ita+eng", "--skip-text", "--optimize", "1"]
    timeout_s: 1800
  vision:
    enabled: true
    # Few characters *and* images present means the meaning lives in the figure.
    trigger_chars_per_page: 250
    # A cover carries one image; a blank page carries none. A real figure page
    # carries dozens of vector ops. Below this, there is nothing to describe and
    # the model will invent something rather than say so.
    min_graphics: 12
    render_dpi: 150

transcript:
  window_seconds: 300
  # The course is taught in non-native English, so auto-captions mangle proper
  # nouns and technical terms and lexical search stops finding them. This runs a
  # local LLM over each window with a per-module glossary. Off => raw captions.
  asr_cleanup: true

chunk:
  target_tokens: 800
  overlap_tokens: 120
  split_on: "headings"

retrieval:
  hybrid: true        # dense + Qdrant full-text, fused with RRF
  k_dense: 30
  k_lexical: 30
  k_final: 8

# What makes a `studykb review` check read ✅ rather than ⚠️. These change a
# verdict, so loosening one means a run stops warning you about something.
# How much each report *prints* is not here — that is src/studykb/limits.py.
review:
  # Below this a chunk is a title page or a part divider: never a useful hit,
  # but it still occupies a vector.
  tiny_chunk_chars: 200
  # Amber once tiny chunks pass this share, but never below the floor: on a
  # small corpus three title pages are not a problem.
  tiny_chunk_share: 0.1
  tiny_chunk_floor: 5
  # "Cover page." — a caption this short describes nothing.
  trivial_caption_chars: 90
  trivial_caption_share: 0.4
  # Above this share of a source's pages extracting to nothing, extraction.md
  # marks it 🔴 instead of ⚠️.
  empty_pages_alarm_share: 0.5
