# Test corpus: a small, hand-picked set used to check the pipeline before the
# real material is indexed.
#
# It writes to its own Qdrant collection, so nothing here can damage the
# qml-master index.

domain: "test"
title: "studykb review set"
root: "/home/locode/Personale/QML/test-corpus"
collection: "studykb_test"
# Extractions and syllabus land here, not in the study vault.
vault: "/home/locode/Personale/QML/test-corpus/vault"

sources:
  - glob: "transcripts/**/*.vtt"
    type: transcript
  - glob: "transcripts/**/*.srt"
    type: transcript
  - glob: "slides/**/*.pdf"
    type: slides
    vision: force
  - glob: "slides/**/*.pptx"
    type: slides
  - glob: "books/**/*.pdf"
    type: book
    vision: never
  - glob: "papers/**/*.pdf"
    type: paper
    vision: never

# No calendar here, and no module_rules: assignment on the test set is done by
# hand in MANIFEST.md, so a parsing problem in the timetable cannot be mistaken
# for a problem in extraction.

glossary:
  - "qubit"
  - "entanglement"
  - "variational quantum circuit"
  - "quantum annealing"
  - "QUBO"
  - "Hamiltonian"
