# Corpus manifest: the only file that knows anything about this subject matter.
# Point studykb at a different corpus.yaml and it indexes a different subject
# with no code change.

domain: "qml-master"
title: "Master in Quantum Machine Learning for Finance and Industry — Ca' Foscari"

# Sources live outside the repo and are never committed. Mounted at /corpus.
root: "/corpus"

# The real syllabus. The master publishes no syllabus document; the timetable is
# the only record of what each lecture covered, so module titles, teachers and
# lecture topics are read from it rather than typed by hand.
calendar:
  source: "Calendario_MasterQML_2526.xlsx"
  sheet: "A.Y._2025_2026"
  columns:                    # matched on header text; positional fallback if absent
    date: "Date"
    time: "Time-\ntable"
    mode: "Lesson type"
    module: "Teaching"
    topic: "Lesson title / topic"
    teacher: "Instructor"
    institution: "Institution / Company"

# Rules are tried in order and the first one to claim a file wins, so the
# specific folders take precedence over the catch-all at the bottom. Material
# downloaded next week is picked up without editing this file.
sources:
  - glob: "transcripts/**/*.vtt"
    type: transcript
  - glob: "transcripts/**/*.srt"
    type: transcript
  # The platform exports its recordings as Word, not as captions. Same content,
  # same timestamps, a different container.
  - glob: "transcripts/**/*.docx"
    type: transcript
  - glob: "transcripts/**/*.docm"
    type: transcript
  - glob: "slides/**/*.pdf"
    type: slides
    vision: force             # slides carry meaning in figures; always caption
  - glob: "slides/**/*.pptx"
    type: slides
  # Vision is off for prose. Measured on this corpus: on books the auto
  # trigger only ever fires on covers, title pages and blanks — the low-text
  # pages — while real figures sit on pages full of surrounding text. Worse,
  # on a cover the 7B model pattern-completes from the title and invents a
  # circuit diagram that was never there. Captioning prose is net-negative.
  - glob: "books/**/*.pdf"
    type: book
    vision: never
  - glob: "papers/**/*.pdf"
    type: paper
    vision: never
  # Notebooks and scripts. Kept apart from papers because they answer a
  # different question — "how is this written" rather than "what is this" — and
  # a separate type is what lets a search exclude them, or ask for only them.
  - glob: "code/**/*.ipynb"
    type: code
    vision: never
  - glob: "code/**/*.py"
    type: code
    vision: never
  - glob: "code/**/*.md"      # notes that ship beside a notebook bundle
    type: code
    vision: never
  - glob: "**/*.pptx"
    type: slides
  - glob: "**/*.pdf"          # anything not placed above
    type: paper
    vision: never

# Nothing to exclude. The corpus root holds study material and nothing else:
# paperwork, the thesis code, the vault and the test corpus all live outside it.
# If this list ever grows again, the root is in the wrong place.
exclude: []

# How a file is assigned to a module. First hit wins; whatever is left over is
# listed by `ingest --dry-run` and belongs in MANIFEST.md.
module_rules:
  - match: "path_regex"
    pattern: "(?i)/M(?P<module>\\d+)[/_ -]"
  - match: "path_regex"
    pattern: "(?P<date>20\\d{2}-\\d{2}-\\d{2})"
    resolve: "calendar_date"   # lecture date -> module, via the timetable

# Fed to the ASR-cleanup prompt on top of the calendar-derived glossary (lecture
# titles and teacher names). Add whatever the captions keep mangling.
glossary:
  - "qubit"
  - "entanglement"
  - "superposition"
  - "variational quantum circuit"
  - "quantum annealing"
  - "QUBO"
  - "Hamiltonian"
  - "Qiskit"
  - "D-Wave"
  - "Boltzmann machine"
  - "tensor network"
  - "noise mitigation"
  - "Grover"
  - "amplitude encoding"
